<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainer-App FC Seuzach</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-DsptTxARB3/D5AKJz5H2uA7rw6pVbh8uNUPjK6chN8M='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#141414">
<script>try{var t=localStorage.getItem("fcs-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FCS Trainer">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48-v3.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v3.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v3.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-row">
      <img src="logo-white.png" alt="FC Seuzach">
      <div class="t"><div class="club">FC Seuzach · <span id="teamName">E-Junioren</span></div><h1 id="title">Planung</h1></div>
      <span class="badge" id="modeBadge"></span>
      <button class="themebtn" id="themeBtn" type="button" aria-label="Darstellung wechseln"></button>
    </div>
    <div class="proto"><span class="who" id="who"></span></div>
  </header>
  <main id="view" aria-live="polite"><p class="empty">Lade …</p></main>
</div>
<nav class="nav" aria-label="Hauptnavigation" hidden><div class="in" id="nav"></div></nav>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="main.js"></script>
</body>
</html>
